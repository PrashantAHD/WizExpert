<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Monthly Governance Reporting</title>
  <desc id="desc">WizExpert is the hub. Cutoff, collect, draft, handoff, retain. Next month starts from retained history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0B2447"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="700" rx="28" fill="url(#bg)"/>
  <text x="48" y="42" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Monthly Governance Reporting</text>
  <text x="48" y="66" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">WizExpert is the hub. Cutoff, collect, draft, handoff, retain. Next month starts from retained history.</text>
  <g fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 126 V154"/>
    <path d="M480 226 V258 H180"/>
    <path d="M480 258 H780"/>
    <path d="M180 258 V292"/>
    <path d="M480 258 V292"/>
    <path d="M780 258 V292"/>
    <path d="M480 226 V400 H300"/>
    <path d="M480 400 H660"/>
    <path d="M300 400 V448"/>
    <path d="M660 400 V448"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="300" y="84" width="360" height="42" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="1">1 · fix cutoff<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.06;0.2;0.21;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">2 · collect<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.36;0.37;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">3 · draft three packs<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.37;0.54;0.55;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">4 · handoff<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.55;0.7;0.71;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">5 · retain history<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.71;0.88;0.89;1" dur="20s" repeatCount="indefinite"/></text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="300" y="154" width="360" height="72" rx="16" fill="#1D4ED8" stroke="#60A5FA"/>
    <text x="480" y="182" text-anchor="middle" fill="#BFDBFE" font-size="12">WIZEXPERT</text>
    <text x="480" y="206" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700">every stage returns here</text>
  </g>
  <circle r="8" fill="#38BDF8" filter="url(#glow)">
    <animate attributeName="cx" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.06688;0.08375;0.1006;0.1831;0.1832;0.2;0.218;0.236;0.254;0.342;0.3421;0.36;0.3802;0.4005;0.4208;0.5198;0.5199;0.54;0.558;0.576;0.594;0.682;0.6821;0.7;0.7202;0.7405;0.7607;0.8598;0.8599;0.88;0.93;1" values="480;480;480;180;180;180;180;480;480;480;480;480;480;480;480;780;780;780;780;480;480;300;300;300;300;480;480;660;660;660;660;480;480;480"/>
    <animate attributeName="cy" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.06688;0.08375;0.1006;0.1831;0.1832;0.2;0.218;0.236;0.254;0.342;0.3421;0.36;0.3802;0.4005;0.4208;0.5198;0.5199;0.54;0.558;0.576;0.594;0.682;0.6821;0.7;0.7202;0.7405;0.7607;0.8598;0.8599;0.88;0.93;1" values="105;190;258;258;346;346;258;190;258;258;346;346;258;190;258;258;346;346;258;190;400;400;500;500;400;190;400;400;500;500;400;190;600;105"/>
  </circle>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(40,292)">
      <rect width="280" height="100" rx="14" fill="url(#card)" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.049;0.05;0.2;0.201;1" dur="20s" repeatCount="indefinite"/>
      </rect>
      <text x="22" y="26" fill="#64748B" font-size="12" font-weight="700">1</text>
      <text x="140" y="28" text-anchor="middle" fill="#3B82F6" font-size="11">CUTOFF</text>
      <text x="140" y="54" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">baseline first</text>
      <text x="140" y="76" text-anchor="middle" fill="#94A3B8" font-size="11">then collect</text>
    </g>
    <g transform="translate(340,292)">
      <rect width="280" height="100" rx="14" fill="url(#card)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.199;0.2;0.36;0.361;1" dur="20s" repeatCount="indefinite"/>
      </rect>
      <text x="22" y="26" fill="#64748B" font-size="12" font-weight="700">2</text>
      <text x="140" y="28" text-anchor="middle" fill="#38BDF8" font-size="11">COLLECT</text>
      <text x="140" y="54" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">Wiz evidence</text>
      <text x="140" y="76" text-anchor="middle" fill="#94A3B8" font-size="11">MCP read-only</text>
    </g>
    <g transform="translate(640,292)">
      <rect width="280" height="100" rx="14" fill="url(#card)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.359;0.36;0.54;0.541;1" dur="20s" repeatCount="indefinite"/>
      </rect>
      <text x="22" y="26" fill="#64748B" font-size="12" font-weight="700">3</text>
      <text x="140" y="28" text-anchor="middle" fill="#F59E0B" font-size="11">DRAFT</text>
      <text x="140" y="54" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">Workbook / deck</text>
      <text x="140" y="76" text-anchor="middle" fill="#94A3B8" font-size="11">/ dashboard</text>
    </g>
    <g transform="translate(160,448)">
      <rect width="280" height="100" rx="14" fill="url(#card)" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.539;0.54;0.7;0.701;1" dur="20s" repeatCount="indefinite"/>
      </rect>
      <text x="22" y="26" fill="#64748B" font-size="12" font-weight="700">4</text>
      <text x="140" y="28" text-anchor="middle" fill="#A78BFA" font-size="11">HANDOFF</text>
      <text x="140" y="54" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">communicate</text>
      <text x="140" y="76" text-anchor="middle" fill="#94A3B8" font-size="11">tool never sends</text>
    </g>
    <g transform="translate(520,448)">
      <rect width="280" height="100" rx="14" fill="url(#card)" stroke="#22C55E" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.699;0.7;0.88;0.881;1" dur="20s" repeatCount="indefinite"/>
      </rect>
      <text x="22" y="26" fill="#64748B" font-size="12" font-weight="700">5</text>
      <text x="140" y="28" text-anchor="middle" fill="#22C55E" font-size="11">RETAIN</text>
      <text x="140" y="54" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">snapshot history</text>
      <text x="140" y="76" text-anchor="middle" fill="#94A3B8" font-size="11">input for next month</text>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="600" width="880" height="72" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1E293B;#1E293B;#14532D;#14532D;#1E293B" keyTimes="0;0.88;0.9;0.98;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#334155;#334155;#22C55E;#22C55E;#334155" keyTimes="0;0.88;0.9;0.98;1" dur="20s" repeatCount="indefinite"/>
    </rect>
    <text x="480" y="628" text-anchor="middle" fill="#94A3B8" font-size="12">NOTHING LEAVES WITHOUT A PERSON</text>
    <text x="480" y="652" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">cutoff → collect → draft → handoff → retain history → next month</text>
  </g>
</svg>
