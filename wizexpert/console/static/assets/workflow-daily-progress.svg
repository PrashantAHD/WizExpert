<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Daily Progress Reporting</title>
  <desc id="desc">WizExpert is the hub. Refresh daily until the closure gate. Then update and stop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0B2447"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="700" rx="28" fill="url(#bg)"/>
  <text x="48" y="42" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Daily Progress Reporting</text>
  <text x="48" y="66" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">WizExpert is the hub. Refresh daily until the closure gate. Then update and stop.</text>
  <g fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 126 V154"/>
    <path d="M480 226 V258 H180"/>
    <path d="M480 258 H780"/>
    <path d="M180 258 V292"/>
    <path d="M480 258 V292"/>
    <path d="M780 258 V292"/>
    <path d="M480 226 V400 H300"/>
    <path d="M480 400 H660"/>
    <path d="M300 400 V448"/>
    <path d="M660 400 V448"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="300" y="84" width="360" height="42" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="1">1 · collect<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.16;0.17;1" dur="22s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">2 · draft pack<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.17;0.28;0.29;1" dur="22s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">3 · communicate<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.29;0.4;0.41;1" dur="22s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">still open → next day<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.41;0.52;0.53;1" dur="22s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">collect again<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.62;0.63;1" dur="22s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">draft again<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.63;0.72;0.73;1" dur="22s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">communicate<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.73;0.82;0.83;1" dur="22s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">gate met → update / close<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.83;0.94;0.95;1" dur="22s" repeatCount="indefinite"/></text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="300" y="154" width="360" height="72" rx="16" fill="#1D4ED8" stroke="#60A5FA"/>
    <text x="480" y="182" text-anchor="middle" fill="#BFDBFE" font-size="12">WIZEXPERT</text>
    <text x="480" y="206" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700">every stage returns here</text>
  </g>
