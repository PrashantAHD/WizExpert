    <rect x="300" y="84" width="360" height="42" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="1">1 · collect<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.04;0.1;0.11;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">2 · draft<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.11;0.17;0.18;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">3 · communicate<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.18;0.24;0.25;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">4 · approval<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.31;0.32;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">5 · remediate<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.32;0.38;0.39;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">6 · validate<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.39;0.45;0.46;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">7 · update reports<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.46;0.52;0.53;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">1 · collect<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.55;0.61;0.62;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">2 · draft<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.61;0.62;0.68;0.69;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">3 · communicate<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.69;0.75;0.76;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">4 · approval<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.76;0.82;0.83;1" dur="32s" repeatCount="indefinite"/></text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700" opacity="0">risk acceptance → update<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.83;0.9;0.91;1" dur="32s" repeatCount="indefinite"/></text>
