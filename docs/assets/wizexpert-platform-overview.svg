<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">WizExpert platform overview</title>
  <desc id="desc">Read-only Wiz evidence flows through four reporting workflows, quality assurance and human approval into private local drafts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07152b"/><stop offset="1" stop-color="#102c4d"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#44a7ff"/><stop offset="1" stop-color="#6c7cff"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#36dbc1"/><stop offset="1" stop-color="#71f2cb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020a18" flood-opacity=".5"/></filter>
    <style>
      .small{font:600 14px Inter,Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase}
      .label{font:600 16px Inter,Arial,sans-serif}.body{font:400 14px Inter,Arial,sans-serif}
      .muted{fill:#aac0dc}.white{fill:#f4f8ff}.blue{fill:#64b7ff}.mint{fill:#5ce8cf}
      .flow{fill:none;stroke:url(#blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:8 12;animation:move 2.4s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}
      @keyframes move{to{stroke-dashoffset:-40}} @keyframes pulse{50%{opacity:.55;transform:scale(1.04);transform-origin:center}}
      @keyframes float{50%{transform:translateY(-5px)}} @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="180" fill="#2875bd" opacity=".12"/>
  <circle cx="120" cy="620" r="220" fill="#26c6ad" opacity=".08"/>
  <text x="70" y="72" class="small mint">WIZEXPERT / EVIDENCE TO ACTION</text>
  <text x="70" y="118" class="white" style="font:800 34px Inter,Arial,sans-serif">A controlled reporting system for cloud security teams</text>
  <text x="70" y="148" class="muted body">Read-only collection in. Validated local drafts out. People stay in control.</text>
  <g filter="url(#shadow)" class="float">
    <rect x="70" y="220" width="210" height="190" rx="18" fill="#102b4b" stroke="#31608e"/>
    <circle cx="120" cy="270" r="27" fill="url(#blue)" class="pulse"/>
    <path d="M108 270h24M120 258v24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="105" y="325" class="label white">Wiz MCP</text><text x="105" y="351" class="body muted">Read-only evidence</text>
    <text x="105" y="375" class="body muted">Scoped queries</text><text x="105" y="399" class="body muted">Retained snapshots</text>
  </g>
  <path class="flow" d="M280 315C330 315 330 315 370 315"/><circle cx="330" cy="315" r="6" fill="#5ce8cf" class="pulse"/>
  <g filter="url(#shadow)" class="float" style="animation-delay:.4s">
    <rect x="370" y="205" width="230" height="220" rx="18" fill="#112d4c" stroke="#31608e"/>
    <rect x="405" y="240" width="160" height="12" rx="6" fill="#3475ae"/><rect x="405" y="269" width="120" height="10" rx="5" fill="#24557f"/><rect x="405" y="298" width="145" height="10" rx="5" fill="#24557f"/>
    <circle cx="418" cy="360" r="8" fill="#5ce8cf"/><text x="440" y="366" class="label white">QA + provenance</text>
    <circle cx="418" cy="390" r="8" fill="#64b7ff"/><text x="440" y="396" class="label white">Delta + lifecycle</text>
  </g>
  <path class="flow" d="M600 315C640 315 640 315 675 315"/>
  <g filter="url(#shadow)">
    <rect x="675" y="185" width="260" height="260" rx="18" fill="#0d2441" stroke="#31608e"/>
    <text x="710" y="225" class="small blue">FOUR WORKFLOWS</text>
    <g class="label white"><rect x="710" y="248" width="12" height="12" rx="3" fill="#ffb45c"/><text x="735" y="260">Risk Issues</text>
      <rect x="710" y="288" width="12" height="12" rx="3" fill="#64b7ff"/><text x="735" y="300">Daily Progress</text>
      <rect x="710" y="328" width="12" height="12" rx="3" fill="#5ce8cf"/><text x="735" y="340">Weekly Progress</text>
      <rect x="710" y="368" width="12" height="12" rx="3" fill="#a78bfa"/><text x="735" y="380">Monthly Governance</text></g>
    <text x="710" y="418" class="body muted">Templates, validators, dashboards</text>
  </g>
  <path class="flow" d="M935 315C975 315 975 315 1010 315"/>
  <g filter="url(#shadow)" class="float" style="animation-delay:.8s">
    <rect x="1010" y="220" width="120" height="190" rx="18" fill="#143a45" stroke="#3b9c9b"/>
    <circle cx="1070" cy="270" r="27" fill="url(#mint)" class="pulse"/>
    <path d="m1057 270 9 9 18-21" fill="none" stroke="#07302e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1032" y="328" class="label white">Human</text><text x="1032" y="351" class="label white">approval</text>
    <text x="1032" y="382" class="body muted">No send</text><text x="1032" y="402" class="body muted">No mutate</text>
  </g>
  <path class="flow" d="M1070 410V525H850"/>
  <g filter="url(#shadow)">
    <rect x="350" y="510" width="500" height="108" rx="18" fill="#102b4b" stroke="#31608e"/>
    <path d="M395 548h26v26h-26z" fill="#5ce8cf" opacity=".9"/><path d="m401 560 7 7 13-15" fill="none" stroke="#07302e" stroke-width="3"/>
    <text x="445" y="553" class="label white">Private, review-ready deliverables</text>
    <text x="445" y="580" class="body muted">Analysis · reports · dashboards · email drafts</text>
    <text x="445" y="602" class="body muted">Stored outside the public checkout</text>
  </g>
  <text x="70" y="655" class="small muted">FICTIONAL CONTOSO DEMO DATA  •  READ-ONLY  •  PEOPLE APPROVE RELEASE</text>
</svg>
