[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "wizexpert"
version = "0.1.0"
description = "WizExpert: analyze, report, validate, coordinate and remediate"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
governance = [
    "python-pptx>=1.0.2,<2",
    "Pillow>=10.0,<14",
    "rich>=13.0,<16",
    "questionary>=2.0,<3",
]
dev = [
    "pip>=26.2,<27",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "bandit>=1.8.6,<2",
    "pip-audit>=2.9,<3",
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
]

[project.scripts]
wizexpert = "wizexpert.__main__:main"
cloud-remediations = "wizexpert.__main__:main"

[tool.setuptools.packages.find]
include = ["wizexpert*", "remediation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
